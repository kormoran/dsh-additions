# dsh-additions bundle patch: inserts the host row into the profile roster.
# The node half (exports ".") registers the `/quit` and `/rename` slash commands,
# declares the `additions` settings namespace, and serves the /api/additions.*
# routes (move, workspace statistics, notification sounds); the browser half
# (exports "./client", declared in package.json dsh.client) adds the "Sposta nel
# workspace…" action, the right-panel «Workspace» tab, the two notification cues
# and the plugin's settings page (Plugins → dsh-additions → additions row).
- insert:
    - id: additions
      name: 'dsh-additions'
      config:
        # Hide the original chat (registry archive) once the copy is safe.
        archiveSource: true
        # `/quit` timing. The command result must reach the browser before the
        # process goes away, so the interrupt is delayed; `graceMs` is the
        # watchdog that forces the exit if graceful disposal stalls.
        quit:
          delayMs: 500
          graceMs: 5000
        # Workspace statistics: bounds for the directory walk behind
        # /api/additions.workspace-stats.
        stats:
          timeLimitMs: 10000
          cacheTtlMs: 15000
        # Notification cues. `enabled`, `ding` and `approval` are the plugin's
        # editable settings fields (`Config` marks them volatile): the settings
        # page writes them into this profile's patch, and they apply live.
        # Point `ding`/`approval` at any absolute audio path (wav/mp3/ogg/
        # m4a/flac); a missing file falls back to the packaged cue. `volume` is
        # an ordinary field, edited here rather than from the page.
        sounds:
          enabled: true
          volume: 0.7
          # ding: 'C:\suoni\campanello.wav'
          # approval: 'C:\suoni\uh-oh.mp3'
